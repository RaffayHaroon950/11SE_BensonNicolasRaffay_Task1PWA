<!DOCTYPE html>

<html>

    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Ripened Raspberries</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main.css">
    </head>

    <body>
        
        <!-- Nav bar -->
        <nav class="navbar">
            <div class="navbar__container">
                <a href="index.html" id="navbar__logo">
                    <img src="RipenedRaspberriesLogoWhite.png" alt="Ripened Raspberries" class="navbar__logo-img">
                </a>

                <div style="display:flex; align-items:center; gap:1rem;">
                    <ul class="navbar__menu">
                <li class="navbar__item">
                    <a href="movies.html" class="navbar__links navbar__highlighted">Movies</a>
                </li>
                <li class="navbar__item">
                    <a href="/" class="navbar__links">RipeBerry News</a>
                </li>
                <li class="navbar__item">
                    <a href="contact_page.html" class="navbar__links">Contact Us</a>
                </li>
                <li class="navbar__btn">
                    <a href="login_page.html" class="button">Log In</a>
                </li>
            </ul>

                    <div class="navbar__toggle" id="mobile-menu" aria-hidden="true">
                        <span class="bar"></span>
                        <span class="bar"></span>
                        <span class="bar"></span>
                    </div>
                </div>
            </div>
        </nav>

        <main class="site-content">
            <img src="background2.png" alt="" aria-hidden="true" class="side-banner left">
            <img src="background2.png" alt="" aria-hidden="true" class="side-banner right">

            <!-- TITLE -->
            <header class="hero" style="padding: 2.5rem 1rem; text-align:center;">
                <h1 style="font-size:3rem; margin-bottom:0.8rem;" id="pageTitle">Best Movies</h1>
                <!-- DROPDOWNS FOR MOVIE FILTERING -->
                 <div>
                    <!-- Sort by popularity -->
                    <select id="popFilter" name="popFilterSelection" class="movies__filterdropdown">
                        <option value="MOST POPULAR" selected>MOST POPULAR</option>
                        <option value="NEWEST">NEWEST</option>
                        <option value="TOP BOX OFFICE">TOP BOX OFFICE</option>
                        <option value="A-Z">A-Z</option>
                    </select>
                    <!-- Genre -->
                    <select id="genreFilter" name="genreFilterSelection" class="movies__filterdropdown">
                        <option value="" selected>ANY GENRE</option>
                        <option value="ACTION">ACTION</option>
                        <option value="ADVENTURE">ADVENTURE</option>
                        <option value="ANIMATION">ANIMATION</option>
                        <option value="ANIME">ANIME</option>
                        <option value="BIOGRAPHY">BIOGRAPHY</option>
                        <option value="COMEDY">COMEDY</option>
                        <option value="MYSTERY">MYSTERY</option>
                        <option value="FANTASY">FANTASY</option>
                        <option value="SCI-FI">SCI-FI</option>
                    </select>
                    <!-- Rating -->
                    <select id="ageFilter" name="ageFilterSelection" class="movies__filterdropdown">
                        <option value="" selected>ANY AGE RATING</option>
                        <option value="G">G</option>
                        <option value="PG">PG</option>
                        <option value="PG-13">PG-13</option>
                    </select>
                    <!-- Raspometer -->
                    <select id="ratingFilter" name="ratingFilterSelection" class="movies__filterdropdown">
                        <option value="" selected>ANY RATING</option>
                        <option value="5">⭐⭐⭐⭐⭐</option>
                        <option value="4">⭐⭐⭐⭐</option>
                        <option value="3">⭐⭐⭐</option>
                        <option value="2">⭐⭐</option>
                        <option value="1">⭐</option>
                    </select>
                    <!-- Reset button -->
                    <div id="selectReset" name="resetButton">Reset</div>
                </div>

            </header>

            <section style="padding:3rem; max-width:1100px; margin:0 auto;">
                <div style="display:grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap:1rem;" id="movieCardContainer">

                </div>
            </section>

            <!-- FOOTER -->
            <footer style="padding:2rem 1rem; text-align:center; color: gray;">
                <small>&copy; 2025 Ripened Raspberries by Brentam Blockbusters</small>
            </footer>
        </main>

        <script src="app.js"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

        <script src="movies.js"></script>

    </body>

</html>
